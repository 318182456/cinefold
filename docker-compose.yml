services:
  cinefold:
    # 用 GitHub Actions 构建好的镜像时，注释掉 build 换成下面的 image
    # image: ghcr.io/318182456/cinefold:latest
    build: .
    image: cinefold:local
    container_name: cinefold
    restart: unless-stopped
    ports:
      - "3750:3750"
    volumes:
      - ./data:/data
      # 下载路径需与 qBittorrent 中的路径保持一致，便于入库校验
      # - /volume3/h_video/Download:/downloads
      # qBittorrent 连接自愈（QB_AUTOHEAL_ENABLED）要重启 qb 容器，需要 Docker
      # socket。不能加 :ro —— 重启是写操作。qb 在别的机器上时不要挂这个，
      # 改用 DOCKER_HOST_URL=tcp://IP:2375
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Asia/Shanghai
      # 默认用 /data 下的 SQLite，无需下面两个服务。
      # 启用 postgres / redis 时取消对应注释，并加上 --profile：
      #   docker compose --profile postgres --profile redis up -d
      # DATABASE_URL: postgresql://cinefold:cinefold@postgres:5432/cinefold
      # REDIS_URL: redis://redis:6379/0
      # REDIS_JOB_STORE: "True"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3750/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    profiles: ["postgres"]
    image: postgres:17-alpine
    container_name: cinefold-postgres
    restart: unless-stopped
    # POSTGRES_* 只在初始化空卷时生效，改这几项不会影响已有的库
    environment:
      POSTGRES_USER: cinefold
      POSTGRES_PASSWORD: cinefold
      POSTGRES_DB: cinefold
      TZ: Asia/Shanghai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinefold -d cinefold"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: cinefold-redis
    restart: unless-stopped
    # 缓存与任务状态都可重建，用 AOF 保证重启后不丢即可
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

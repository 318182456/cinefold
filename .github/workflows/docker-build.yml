name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # 只改文档时不触发构建
    paths-ignore:
      - '**.md'
      - '.gitignore'
  # 手动触发
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub 镜像名，未配置 DOCKERHUB_USERNAME 时自动跳过推送
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'byte-muse' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要父提交才能比对 VERSION 是否变更
          fetch-depth: 2

      - name: 读取版本号
        id: version
        run: |
          VALUE=$(cat VERSION | tr -d '[:space:]')
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

          # 只有发版（VERSION 变更）才更新 latest，
          # 日常提交推送的镜像不覆盖它。打 tag 发版时也算。
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "打 tag 发版，将更新 latest"
          elif git rev-parse HEAD~1 >/dev/null 2>&1 \
            && [ "$(git show HEAD~1:VERSION 2>/dev/null | tr -d '[:space:]')" != "$VALUE" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "VERSION 已变更为 $VALUE，将更新 latest"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "VERSION 未变更（$VALUE），跳过 latest"
          fi

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # secrets 不能直接用在 if 条件里，先转成 output
      - name: 检查 Docker Hub 凭证
        id: dockerhub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "已配置 Docker Hub 凭证，将同时推送"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过 Docker Hub"
          fi

      - name: 登录 Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE }},enable=${{ steps.dockerhub.outputs.enabled == 'true' }}
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.released == 'true' }}
            type=raw,value=${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像信息
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.version.outputs.released }}" = "true" ]; then
            echo "> VERSION 为 ${{ steps.version.outputs.value }}，已更新 latest。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> VERSION 未变更，latest 仍指向上一个发布版本。" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.dockerhub.outputs.enabled }}" != "true" ]; then
            echo "> 未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次只推送到 GHCR。" >> "$GITHUB_STEP_SUMMARY"
          fi

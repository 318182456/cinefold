name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    # 只改文档时不触发构建
    paths-ignore:
      - '**.md'
      - '.gitignore'
  # 手动触发
  workflow_dispatch:

# 不监听 tag：发版 tag 由 release.yml 在 VERSION 变更时自动建，而那次
# VERSION 提交本身已经触发过一次构建了。再监听 tag 就是同一份代码构建两遍，
# 白烧一次 GHCR 写入 —— GHCR 的次级速率限制正是按写入次数算的。
# latest 的更新不依赖 tag，靠下面的 VERSION 变更判定。

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub 镜像名，未配置 DOCKERHUB_USERNAME 时自动跳过推送
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'cinefold' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要父提交才能比对 VERSION 是否变更
          fetch-depth: 2

      - name: 读取版本号
        id: version
        run: |
          VALUE=$(cat VERSION | tr -d '[:space:]')
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

          # 只有发版（VERSION 变更）才更新 latest，
          # 日常提交推送的镜像不覆盖它
          if git rev-parse HEAD~1 >/dev/null 2>&1 \
            && [ "$(git show HEAD~1:VERSION 2>/dev/null | tr -d '[:space:]')" != "$VALUE" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "VERSION 已变更为 $VALUE，将更新 latest"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "VERSION 未变更（$VALUE），跳过 latest"
          fi

      # 只构建 amd64，不需要 QEMU 跨架构模拟。要加回 arm64 时，
      # 把 docker/setup-qemu-action@v3 重新插回这里
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # secrets 不能直接用在 if 条件里，先转成 output
      - name: 检查 Docker Hub 凭证
        id: dockerhub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "已配置 Docker Hub 凭证，将同时推送"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过 Docker Hub"
          fi

      - name: 登录 Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        # 不打 sha tag：每个 tag 都是一次 registry 写入，日常提交逐次累积容易
        # 触发 GHCR 次级速率限制，而 sha-xxxxxxx 这类 tag 平时根本不会去拉。
        # 需要定位某次提交的镜像时，看 VERSION tag 或构建日志即可。
        # 注：tags 是多行字符串，里面不能写 # 注释，会被当成 tag 定义
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE }},enable=${{ steps.dockerhub.outputs.enabled == 'true' }}
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.released == 'true' }}
            type=raw,value=${{ steps.version.outputs.value }},enable={{is_default_branch}}

      # 只出 linux/amd64。多架构下每个平台都要单独写一份 manifest（外加
      # attestation），registry 写入次数翻倍，更容易撞上 GHCR 的次级速率限制；
      # arm64 在 runner 上还得靠 QEMU 模拟编译，慢得多。
      # ARM 设备（树莓派、ARM 版 NAS）需要镜像时，把 platforms 改回
      # linux/amd64,linux/arm64 并把 setup-qemu-action 加回去。
      #
      # GHCR 的次级速率限制会把推送打回 403，正文里写的是 secondary rate limit。
      # 镜像层此时通常已经推完，只差写 tag，等一会儿重试就能过去 —— 所以失败
      # 不直接判死，退避后再试两次。构建缓存还在，重试几乎只花推送的时间。
      - name: 构建并推送
        id: push
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 推送失败，等待后重试
        if: steps.push.outcome == 'failure'
        run: |
          echo "首次推送失败，多为 GHCR 次级速率限制，等待 120 秒后重试"
          sleep 120

      - name: 重试推送
        id: retry
        if: steps.push.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # 重试不再写缓存：内容与上一次完全相同，写了是白费时间
          cache-to: ''

      - name: 二次失败，加长等待后最后一试
        if: steps.push.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: |
          echo "重试仍失败，等待 300 秒后做最后一次尝试"
          sleep 300

      - name: 最后一次推送
        if: steps.push.outcome == 'failure' && steps.retry.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ''

      - name: 输出镜像信息
        # 前面的推送步骤带 continue-on-error，走到这里说明最终推成功了
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.push.outcome }}" = "failure" ]; then
            echo "> 首次推送被 GHCR 限流，重试后成功。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.version.outputs.released }}" = "true" ]; then
            echo "> VERSION 为 ${{ steps.version.outputs.value }}，已更新 latest。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> VERSION 未变更，latest 仍指向上一个发布版本。" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.dockerhub.outputs.enabled }}" != "true" ]; then
            echo "> 未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次只推送到 GHCR。" >> "$GITHUB_STEP_SUMMARY"
          fi

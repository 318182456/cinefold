<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101316" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="影视资源订阅与整理" />
    <!-- iOS 不读 manifest 的 display/icons，这几条得单独给 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="cinefold" />
    <!-- black-translucent 让内容铺到状态栏下，配合 viewport-fit=cover 和
         布局里的 safe-area padding 使用 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 与 AppLogo.vue 共用胶片折页标识。 -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>cinefold</title>
  </head>
  <body class="bg-gray-950">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

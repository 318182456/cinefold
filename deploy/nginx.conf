user root;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 32m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # .webmanifest 不在 nginx 自带的 mime.types 里，不补这条会按
    # application/octet-stream 发出去，部分浏览器据此拒绝解析 manifest，
    # PWA 就装不上
    types {
        application/manifest+json webmanifest;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml
               application/manifest+json image/svg+xml;

    server {
        listen [::]:3750;
        listen 3750;

        # index.html 必须禁缓存，且这条要盖住所有拿得到它的路径。
        #
        # 访问根路径时 $uri 就是 "/"，前缀块里的 try_files 会把它当目录、
        # 按 index 指令直接把 index.html 吐出去，根本不进 @spa —— 那是最常见的
        # 入口，却恰好漏掉了禁缓存头。所以这里用精确匹配 = / 和 = /index.html
        # 把入口页单独拎出来，无论从哪个方向进来都走同一段逻辑。
        #
        # internal 的 @spa 依然保留，前端路由 fallback 还要靠它
        location = / {
            root /data/updates/web/current;
            try_files /index.html @image_spa;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }

        location = /index.html {
            root /data/updates/web/current;
            try_files /index.html @image_spa;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }

        # Service Worker 必须禁缓存。它的文件名不带哈希，浏览器一旦按默认策略
        # 把它缓存住，新版 sw.js 就永远推不下去，用户被钉死在旧版本的缓存策略上。
        # manifest 同理，改了图标或名字得能立刻生效
        location = /sw.js {
            root /data/updates/web/current;
            try_files /sw.js @image_sw;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
        }

        location @image_sw {
            root /usr/share/nginx/html;
            try_files /sw.js =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
        }

        location = /manifest.webmanifest {
            root /data/updates/web/current;
            try_files /manifest.webmanifest @image_manifest;
            add_header Cache-Control "no-cache" always;
        }

        location @image_manifest {
            root /usr/share/nginx/html;
            try_files /manifest.webmanifest =404;
            add_header Cache-Control "no-cache" always;
        }

        # 静态资源：热更新装过前端时 /data/updates/web/current 里是新版产物，
        # 优先走它，缺文件再回落到镜像里烧死的那份。root 不能按目录存在与否
        # 动态切换，所以用 try_files 串两个位置。
        #
        # 两个 root 下的文件名不会混淆：Vite 产物带内容哈希，同名即同内容。
        # 找不到就交给 @spa 出入口页，SPA 的前端路由由它接管
        location / {
            root /data/updates/web/current;
            try_files $uri @image_asset;
        }

        # 带内容哈希的 Vite 产物。文件名即版本，改了内容就换名字，
        # 所以可以放心让浏览器长期缓存，热更新后请求的是新文件名，不会命中旧的
        location /assets/ {
            root /data/updates/web/current;
            try_files $uri @image_hashed;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        # 两个 root 都没有就是 404，不能回落到 @spa。/assets/ 下的请求都是
        # index.html 里写死的哈希文件名，浏览器按名字来取，不是用户输的路径，
        # 取不到就是产物残缺（overlay 装了一半、清理时删漏），此时回 index.html
        # 只会让浏览器把 HTML 当 JS 解析报 "Unexpected token '<'"，还被上面的
        # immutable 缓存一年，故障现场被掩盖成一个和缓存有关的假象。
        # 直接 404 才能让问题当场暴露在 Network 面板里
        location @image_hashed {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        location @image_asset {
            root /usr/share/nginx/html;
            try_files $uri @spa;
        }

        # SPA 入口。同样优先 overlay，且必须禁缓存 —— 热更新后 js/css 的
        # 文件名带新哈希，但 index.html 名字不变，浏览器缓存住它就永远
        # 按旧清单去加载已经不存在的资源
        location @spa {
            root /data/updates/web/current;
            try_files /index.html @image_spa;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }

        location @image_spa {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }

        # 容器起来时 nginx 秒开、后端还在初始化，这段窗口期打过来的请求
        # 一律 502。默认错误页是英文的 "Upstream service is not running"，
        # 换成"后台启动中"的等待页，它自己会轮询刷新
        error_page 502 503 504 /__starting.html;

        location = /__starting.html {
            root /etc/nginx/html;
            internal;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location @api_starting {
            add_header Content-Type application/json always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            # 保持 502，让前端能区分"后端没起来"和正常的业务失败
            return 502 '{"code":502,"message":"后台启动中，请稍候","data":null}';
        }

        location /api/ {
            # 接口走 XHR，返回等待页的 HTML 前端没法用，改回统一响应体，
            # 让 axios 拦截器能取到 message
            error_page 502 503 504 @api_starting;

            proxy_pass http://127.0.0.1:56168/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
        }

        # 本地图片缓存目录
        location /pic/ {
            alias /data/pics/;
            try_files $uri $uri/ =404;
            expires 30d;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin *;
        }
    }
}

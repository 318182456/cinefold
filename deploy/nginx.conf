user root;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 32m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen [::]:3750;
        listen 3750;

        # 静态资源：热更新装过前端时 /data/updates/web/current 里是新版产物，
        # 优先走它，缺文件再回落到镜像里烧死的那份。root 不能按目录存在与否
        # 动态切换，所以用 try_files 串两个位置。
        #
        # 两个 root 下的文件名不会混淆：Vite 产物带内容哈希，同名即同内容。
        # 找不到就交给 @spa 出入口页，SPA 的前端路由由它接管
        location / {
            root /data/updates/web/current;
            try_files $uri @image_asset;
        }

        location @image_asset {
            root /usr/share/nginx/html;
            try_files $uri @spa;
        }

        # SPA 入口。同样优先 overlay，且必须禁缓存 —— 热更新后 js/css 的
        # 文件名带新哈希，但 index.html 名字不变，浏览器缓存住它就永远
        # 按旧清单去加载已经不存在的资源
        location @spa {
            root /data/updates/web/current;
            try_files /index.html @image_spa;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location @image_spa {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:56168/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
        }

        # 本地图片缓存目录
        location /pic/ {
            alias /data/pics/;
            try_files $uri $uri/ =404;
            expires 30d;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin *;
        }
    }
}

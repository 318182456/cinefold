[supervisord]
user=root
logfile=/dev/null
logfile_maxbytes=0
loglevel=warn
pidfile=/tmp/supervisord.pid
nodaemon=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fastapi]
command=python3 /app/main.py
directory=/app
user=root
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

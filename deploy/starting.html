<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cinefold 后台启动中</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f6f7f9; color: #1f2328;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e6e8eb; }
    .hint { color: #9aa3ad !important; }
    .spinner { border-color: #3a3f45 !important; border-top-color: #6ea8fe !important; }
  }
  .box { text-align: center; padding: 24px; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 20px;
    border: 3px solid #dfe3e8; border-top-color: #3b82f6; border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
  .hint { font-size: 13px; color: #656d76; margin: 0; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>后台启动中</h1>
    <p class="hint">服务正在初始化，页面会自动刷新</p>
  </div>
  <script>setTimeout(function () { location.reload(); }, 3000);</script>
</body>
</html>
